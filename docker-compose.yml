services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: garage37
      MARIADB_USER: garage37
      MARIADB_PASSWORD: garage37
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8095:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: garage37
      WORDPRESS_DB_USER: garage37
      WORDPRESS_DB_PASSWORD: garage37
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/garage37:/var/www/html/wp-content/themes/garage37

  # Uruchamiane na żądanie: docker compose run --rm wpcli <komenda wp>
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      - db
      - wordpress
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: wp
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: garage37
      WORDPRESS_DB_USER: garage37
      WORDPRESS_DB_PASSWORD: garage37
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/garage37:/var/www/html/wp-content/themes/garage37
    profiles:
      - cli

volumes:
  db_data:
  wp_core:
